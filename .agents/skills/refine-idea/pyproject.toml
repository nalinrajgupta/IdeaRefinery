[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "idea-refinery"
version = "0.1.0"
description = "Deterministic support runtime for the Idea Refinery Full skill"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
idea-refinery = "idea_refinery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/idea_refinery"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "idea_refinery/schemas"
"defaults" = "idea_refinery/defaults"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "performance: deterministic latency regression tests",
]

[tool.coverage.run]
branch = true
source = ["idea_refinery"]

[tool.coverage.report]
show_missing = true
skip_covered = true
