name: Idea Refinery deterministic evals

on:
  push:
    paths:
      - "idea-refinery-full/**"
      - "idea-refinery-implement/**"
      - "specs/001-refinery-quality-orchestration/**"
      - ".agents/skills/**"
      - "tools/**"
      - "tests/**"
      - "docs/host-compatibility.md"
      - ".github/workflows/refinery-evals.yml"
  pull_request:
    paths:
      - "idea-refinery-full/**"
      - "idea-refinery-implement/**"
      - "specs/001-refinery-quality-orchestration/**"
      - ".agents/skills/**"
      - "tools/**"
      - "tests/**"
      - "docs/host-compatibility.md"
      - ".github/workflows/refinery-evals.yml"

jobs:
  deterministic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idea-refinery-full
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv sync --extra dev
      - run: uv run pytest --cov=idea_refinery --cov-report=term-missing

  host-skill-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv run --project idea-refinery-full --extra dev python -m pytest tests/unit/test_host_skill_distribution.py
